[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docapi-sdk"
version = "0.1.0"
description = "Official Python SDK for DocAPI — generate PDFs and screenshots from HTML"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
keywords = ["pdf", "screenshot", "html-to-pdf", "og-image", "docapi", "document", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://www.docapi.co"
Documentation = "https://www.docapi.co/docs"
Repository = "https://github.com/Doc-API-LLC/docapi-python"
"Bug Tracker" = "https://github.com/Doc-API-LLC/docapi-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["docapi"]
